<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Halaman error: jangan diindeks mesin pencari.
         Semua path diawali "/" karena halaman ini bisa tampil di URL mana pun. -->
    <title>404 - Halaman Tidak Ditemukan | Kampung Dosay</title>
    <meta name="description" content="Halaman Tidak Ditemukan.">
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" type="image/png" href="/images/logo-kabupaten-jayapura.png">
    <link rel="apple-touch-icon" href="/images/logo-kabupaten-jayapura.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>

    <meta name="theme-color" content="#1a3c34">
</head>
<body data-page="error" class="bg-stone-50 text-stone-800 min-h-screen flex flex-col">

    <div id="site-header"></div>

    <main class="flex-1 flex items-center papua-pattern">
        <section class="w-full py-16 md:py-24">
            <div class="max-w-2xl mx-auto px-6 text-center">
                <div class="w-20 h-20 mx-auto mb-6 flex items-center justify-center rounded-full bg-amber-100 text-amber-600 text-3xl">
                    <i class="fa-solid fa-map-location-dot" aria-hidden="true"></i>
                </div>
                <p class="section-title text-7xl md:text-9xl font-bold text-emerald-900 leading-none tracking-tight" aria-hidden="true">404</p>
                <div class="w-24 h-1 bg-amber-500 mx-auto my-6"></div>
                <h1 class="section-title text-3xl md:text-4xl font-bold text-emerald-900 mb-4">Halaman Tidak Ditemukan</h1>
                <p class="text-stone-600 leading-relaxed mb-6">Halaman yang Anda cari mungkin sudah dipindahkan, diganti namanya, atau tidak pernah ada.</p>
                <p class="text-sm text-stone-500 mb-8 break-all">
                    Alamat: <code id="error-url" class="bg-stone-200/70 text-emerald-900 px-2 py-0.5 rounded"></code>
                </p>
                <script>document.getElementById('error-url').textContent = location.pathname + location.search;</script>

                <div class="flex flex-col sm:flex-row gap-4 justify-center">
                    <a href="/"
                       class="uppercase inline-flex items-center justify-center gap-2 bg-amber-500 hover:bg-amber-600 text-white font-semibold px-8 py-4 transition-colors shadow-md">
                        <i class="fa-solid fa-house"></i> Ke Beranda
                    </a>
                    <button type="button" onclick="history.length > 1 ? history.back() : (location.href = '/')"
                            class="uppercase inline-flex items-center justify-center gap-2 border-2 border-emerald-900 text-emerald-900 hover:bg-emerald-900 hover:text-white font-semibold px-8 py-4 transition-colors">
                        <i class="fa-solid fa-arrow-left"></i> Kembali
                    </button>
                </div>

                <p class="mt-8 text-sm text-stone-500">
                    Butuh bantuan? <a href="/kontak/" class="font-semibold text-emerald-900 hover:text-amber-600 underline underline-offset-2">Hubungi kami</a>.
                </p>

                <div class="mt-14 pt-8 border-t border-stone-200">
                    <p class="text-xs uppercase tracking-widest text-stone-500 font-semibold mb-4">Mungkin Anda mencari</p>
                    <nav class="flex flex-wrap justify-center gap-2" aria-label="Halaman lain">
                        <a href="/" class="px-4 py-2 rounded-full border border-stone-300 bg-white text-sm text-emerald-900 hover:border-amber-500 hover:text-amber-600 transition-colors">Beranda</a>
                        <a href="/tentang/" class="px-4 py-2 rounded-full border border-stone-300 bg-white text-sm text-emerald-900 hover:border-amber-500 hover:text-amber-600 transition-colors">Tentang</a>
                        <a href="/pemerintahan/" class="px-4 py-2 rounded-full border border-stone-300 bg-white text-sm text-emerald-900 hover:border-amber-500 hover:text-amber-600 transition-colors">Pemerintahan</a>
                        <a href="/transparansi/" class="px-4 py-2 rounded-full border border-stone-300 bg-white text-sm text-emerald-900 hover:border-amber-500 hover:text-amber-600 transition-colors">Transparansi</a>
                        <a href="/potensi/" class="px-4 py-2 rounded-full border border-stone-300 bg-white text-sm text-emerald-900 hover:border-amber-500 hover:text-amber-600 transition-colors">Potensi</a>
                        <a href="/fasilitas/" class="px-4 py-2 rounded-full border border-stone-300 bg-white text-sm text-emerald-900 hover:border-amber-500 hover:text-amber-600 transition-colors">Fasilitas</a>
                        <a href="/galeri/" class="px-4 py-2 rounded-full border border-stone-300 bg-white text-sm text-emerald-900 hover:border-amber-500 hover:text-amber-600 transition-colors">Galeri</a>
                        <a href="/kontak/" class="px-4 py-2 rounded-full border border-stone-300 bg-white text-sm text-emerald-900 hover:border-amber-500 hover:text-amber-600 transition-colors">Kontak</a>
                    </nav>
                </div>
            </div>
        </section>
    </main>

    <div id="site-footer"></div>

    <script src="/assets/js/layout.js"></script>
    <script src="/assets/js/main.js"></script>
</body>
</html>
